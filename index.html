<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khidmat Nasihat Kewangan Profesional</title>
    <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4">

    <div class="max-w-4xl w-full bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col md:flex-row">
        <!-- Bahagian Maklumat / Copywriting -->
        <div class="bg-blue-600 text-white p-8 md:w-1/2 flex flex-col justify-center">
            <h1 class="text-3xl font-bold mb-4">Rancang Kewangan Anda Hari Ini</h1>
            <p class="text-blue-100 mb-6">Dapatkan khidmat nasihat pakar untuk pengurusan harta, pelaburan, dan perlindungan masa depan anda.</p>
            <ul class="space-y-4">
                <li class="flex items-center">
                    <svg class="w-6 h-6 mr-3 text-blue-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> 
                    Analisis Kewangan Percuma
                </li>
                <li class="flex items-center">
                    <svg class="w-6 h-6 mr-3 text-blue-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> 
                    Pelan Pelaburan Khusus
                </li>
            </ul>
        </div>

        <!-- Bahagian Borang Web3Forms -->
        <div class="p-8 md:w-1/2">
            <h2 class="text-2xl font-semibold text-gray-800 mb-6">Tinggalkan Maklumat Anda</h2>
            
            <form action="[https://api.web3forms.com/submit](https://api.web3forms.com/submit)" method="POST" class="space-y-5">
                <!-- Gantikan dengan Access Key Web3Forms anda -->
                <input type="hidden" name="access_key" value="YOUR_ACCESS_KEY_HERE">
                
                <!-- Pilihan Redirect Selepas Hantar -->
                <input type="hidden" name="redirect" value="[https://domain-anda.com/terima-kasih](https://domain-anda.com/terima-kasih)">

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nama Penuh</label>
                    <input type="text" name="name" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-600 focus:border-blue-600 outline-none transition-all">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Nombor Telefon</label>
                    <input type="tel" name="phone" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-600 focus:border-blue-600 outline-none transition-all">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Fokus Utama</label>
                    <select name="minat" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-600 focus:border-blue-600 outline-none transition-all bg-white">
                        <option value="Pelaburan">Pelaburan & Simpanan</option>
                        <option value="Takaful">Perlindungan / Takaful</option>
                        <option value="Pengurusan Harta">Pengurusan Harta</option>
                    </select>
                </div>
                
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition duration-200 mt-2 shadow-md hover:shadow-lg">
                    Hantar Permohonan
                </button>
            </form>
        </div>
    </div>

</body>
</html>
